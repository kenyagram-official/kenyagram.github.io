<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kenyagram Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           LEFT SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 245px;
            height: 100vh;
            background: #050505;
            border-right: 1px solid #262626;
            padding: 25px 12px;
            z-index: 100;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            padding: 10px 14px 35px;
            background: linear-gradient(
                45deg,
                #00a651,
                #f9d616,
                #ff0080
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 14px;
            margin: 5px 0;
            border-radius: 10px;
            color: #fff;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #181818;
        }

        .nav-icon {
            width: 27px;
            font-size: 23px;
            text-align: center;
        }

        .notification {
            background: #ff3040;
            color: white;
            border-radius: 50%;
            font-size: 11px;
            padding: 3px 6px;
            margin-left: auto;
        }

        /* =========================
           MAIN PROFILE
        ========================= */

        .main {
            margin-left: 245px;
            min-height: 100vh;
            padding: 45px 30px 80px;
        }

        .profile-container {
            max-width: 935px;
            margin: auto;
        }

        /* =========================
           PROFILE HEADER
        ========================= */

        .profile-header {
            display: flex;
            gap: 70px;
            padding-bottom: 45px;
            border-bottom: 1px solid #262626;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 4px;

            background: linear-gradient(
                45deg,
                #00a651,
                #f9d616,
                #ed1c24,
                #ff0080
            );

            flex-shrink: 0;
        }

        .profile-picture-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #151515;
            border: 4px solid #000;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 65px;
        }

        .profile-information {
            flex: 1;
            padding-top: 5px;
        }

        .username-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .username {
            font-size: 27px;
            font-weight: 400;
        }

        .verified {
            color: #3897f0;
            font-size: 18px;
        }

        .settings {
            border: none;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: flex;
            gap: 35px;
            margin: 25px 0;
        }

        .stat {
            font-size: 15px;
        }

        .stat strong {
            font-size: 16px;
        }

        /* =========================
           BIO
        ========================= */

        .bio {
            line-height: 1.5;
            font-size: 14px;
            max-width: 500px;
        }

        .bio .green {
            color: #00a651;
        }

        /* =========================
           PROFILE BUTTONS
        ========================= */

        .profile-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .profile-button {
            border: none;
            background: #262626;
            color: #fff;
            border-radius: 8px;
            height: 40px;
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .profile-button:hover {
            background: #363636;
        }

        /* =========================
           HIGHLIGHTS
        ========================= */

        .highlights {
            display: flex;
            gap: 25px;
            padding: 30px 5px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .highlights::-webkit-scrollbar {
            display: none;
        }

        .highlight {
            min-width: 80px;
            text-align: center;
            cursor: pointer;
        }

        .highlight-image {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #171717;
            border: 3px solid #292929;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 31px;
            margin: auto;
        }

        .highlight-name {
            margin-top: 8px;
            font-size: 12px;
        }

        /* =========================
           PROFILE TABS
        ========================= */

        .profile-tabs {
            display: flex;
            height: 55px;
            border-top: 1px solid #262626;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            position: relative;
        }

        .tab.active {
            color: #fff;
        }

        .tab.active::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #fff;
        }

        /* =========================
           POST GRID
        ========================= */

        .post-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .grid-post {
            aspect-ratio: 1 / 1;
            background: #151515;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            cursor: pointer;
        }

        .grid-post:nth-child(1) {
            background: linear-gradient(135deg, #182a20, #005b32);
        }

        .grid-post:nth-child(2) {
            background: linear-gradient(135deg, #201919, #795548);
        }

        .grid-post:nth-child(3) {
            background: linear-gradient(135deg, #152030, #1e4c70);
        }

        .grid-post:nth-child(4) {
            background: linear-gradient(135deg, #342b16, #a67c00);
        }

        .grid-post:nth-child(5) {
            background: linear-gradient(135deg, #32152e, #8c267a);
        }

        .grid-post:nth-child(6) {
            background: linear-gradient(135deg, #172d30, #00796b);
        }

        .grid-post:hover::after {
            content: "♥ 128   💬 24";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
        }

        /* =========================
           MOBILE NAV
        ========================= */

        .mobile-nav {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                padding: 15px 0 70px;
            }

            .profile-container {
                width: 100%;
            }

            .profile-header {
                gap: 20px;
                padding: 15px;
                align-items: flex-start;
            }

            .profile-picture {
                width: 88px;
                height: 88px;
            }

            .profile-picture-inner {
                font-size: 40px;
            }

            .profile-information {
                padding-top: 0;
            }

            .username {
                font-size: 20px;
            }

            .stats {
                gap: 15px;
                margin: 15px 0;
            }

            .stat {
                font-size: 12px;
            }

            .stat strong {
                font-size: 14px;
            }

            .bio {
                font-size: 13px;
            }

            .profile-buttons {
                margin-top: 15px;
            }

            .profile-button {
                flex: 1;
                padding: 0 8px;
                font-size: 12px;
            }

            .highlights {
                padding: 20px 12px;
                gap: 18px;
            }

            .highlight {
                min-width: 65px;
            }

            .highlight-image {
                width: 65px;
                height: 65px;
            }

            .profile-tabs {
                height: 50px;
            }

            .tab {
                font-size: 20px;
            }

            .post-grid {
                gap: 2px;
            }

            .grid-post {
                font-size: 40px;
            }

            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 62px;
                background: #050505;
                border-top: 1px solid #262626;

                display: flex;
                justify-content: space-around;
                align-items: center;

                z-index: 200;
            }

            .mobile-nav button {
                background: none;
                border: none;
                color: #fff;
                font-size: 23px;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>

    <!-- =========================

        </div>

        <button class="nav-item" onclick="goHome()">

        </div>

    </main>


    <!-- MOBILE NAVIGATION -->

</html>
